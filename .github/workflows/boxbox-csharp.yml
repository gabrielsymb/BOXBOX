name: BOXBOX C# build and verification

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Godot C# project
        run: dotnet build BOXBOX/boxbox/BOXBOX.csproj --configuration Release
      - name: Verify headless simulation
        run: dotnet run --project BOXBOX/verification/BOXBOX.Verification.csproj --configuration Release
